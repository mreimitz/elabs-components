# .repo-cleanup.yml — configuration for the `repo-cleanup` skill.
# Every key is optional; the defaults live in
# `.claude/skills/repo-cleanup/scripts/config.mjs` (DEFAULT_CONFIG).
version: 1

# ── Cost (deliberately UNSET) ────────────────────────────────────────────────
# With no `pricing` block, `usage-forensics.mjs` reports `cost.available: false`
# and the audit carries token counts but no currency figure. That is the correct
# default: guessing a price list would make the most quotable number in the
# report the least defensible one.
#
# Fill this in with the prices from YOUR plan — USD per MILLION tokens — and the
# next audit turns 10.5 B cache-read tokens into a number you can act on. The
# figure stays an ESTIMATE even then (it ignores discounts, plan tiers and model
# mix) and the report labels it as one every time it appears.
#
# pricing:
#   input: 0
#   output: 0
#   cacheRead: 0
#   cacheCreation: 0

# ── Protected paths ──────────────────────────────────────────────────────────
# `fix` mode refuses to touch these, on top of whatever CLAUDE.md and
# `.claude/rules/**` already declare sacred. Listed here because this repo's own
# rules make them byte-identity or single-writer seams:
#   - packages/tokens/src/themes.css  — the ONLY home for raw colour literals
#     (`.claude/rules/styling-and-tokens.md`); token values round-trip through
#     `pnpm tokens:build`, so a hand edit here desynchronises the DTCG source.
#   - brand-ui.manifest.json          — generated by `pnpm manifest`, never edited.
#   - pnpm-lock.yaml                  — lockfile.
protected_paths:
  - packages/tokens/src/themes.css
  - brand-ui.manifest.json
  - pnpm-lock.yaml
