# Answer "can CI publish to npm?" WITHOUT tagging a release.
#
# Why this exists: the v4.0.0 attempt burned two release runs discovering that
# the publish had no credential at all (`npm error code ENEEDAUTH`) — and a
# release run is the worst place to learn that, because everything before the
# publish (verdict, build, five preflights) has already been paid for, and the
# only remedy is a re-tag. This workflow runs the same authentication the
# release does, stops before anything is published, and takes ~30 seconds.
#
# Run it from the Actions tab (or `gh workflow run npm-credential.yml`) BEFORE
# tagging, whenever the token was rotated, the scope changed hands, or a release
# has failed at the registry. It publishes nothing and needs no tag.
name: npm credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Can CI publish to npm?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@elabs-ai"

      # The same three things `release.yml`'s "Registry authentication" step
      # does — the secret exists, the auth line is written where pnpm reads it,
      # and the registry recognises the token — plus the question that one
      # cannot answer on its own: does this identity actually hold publish
      # rights on the scope? A token that authenticates as the wrong account
      # fails at the publish, not at `whoami`.
      - name: Verify the credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::secrets.NPM_TOKEN is empty or not visible to this workflow." >&2
            echo "Add an npm token with publish rights for the @elabs-ai scope as the NPM_TOKEN repository secret." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" >> "${HOME}/.npmrc"

          echo "── identity ────────────────────────────────────────────────"
          if ! who="$(npm whoami --registry https://registry.npmjs.org 2>&1)"; then
            echo "::error::the token did not authenticate: ${who}" >&2
            echo "Most likely: expired, revoked, or copied with surrounding whitespace." >&2
            exit 1
          fi
          echo "authenticated as: ${who}"

          echo "── scope permissions ───────────────────────────────────────"
          # `ls-packages` on a scope that has never published is legitimately
          # empty, so this is INFORMATIONAL: a failure here means the identity
          # cannot see the scope at all, which is the interesting signal.
          npm access list packages @elabs-ai --registry https://registry.npmjs.org \
            || echo "note: could not list @elabs-ai packages — expected while the scope has no published package, but a permissions error here is the real problem."

          echo "── org membership ──────────────────────────────────────────"
          npm org ls elabs-ai --registry https://registry.npmjs.org \
            || echo "note: not an npm ORG, or this identity cannot read its member list. That is fine if @elabs-ai is a personal scope."
