# CI: every quality check, on every PR and every push to main.
# What each step covers: docs/GATES.md. Release/publish lives in release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly: the full create matrix (Windows and macOS too), which a routine push
  # no longer pays for — see the `changes` job.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      # Every check below runs even when an earlier one failed (`!cancelled()`), so ONE
      # run reports every failure. Stopping at the first one hid the next: a Format
      # failure hid a machine-path finding, which hid a stale self-test, and each took
      # its own push-and-wait round to surface (2026-09-25).
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - name: Check (rules + external commands)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check
      - name: Check self-tests (rule fixtures + scripts/**/*.test.mjs)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:test
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      # The steps below need the build.
      - name: Keep the Storybook build for the website job (/storybook/ smoke)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/docs/storybook-static/
          if-no-files-found: ignore
          retention-days: 1
      - name: Built-output checks (CSS assets, optional-peer types, chart tree-shake)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/check-css-assets.mjs
          node scripts/check-optional-peer-types.mjs
          node packages/cli/scripts/check-chart-treeshake.mjs
      - name: Generated artifacts are fresh
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm gen:check
      - name: Consumer install smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm consumer:check

  storybook:
    name: Storybook interaction + axe (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/components-docs exec playwright install --with-deps chromium
      - name: Story tests
        # A healthy leg takes ~20 min. The step limit turns a hung story into a plain
        # failure at 30 min, instead of a whole-job "cancelled" at 45.
        timeout-minutes: 30
        env:
          STORYBOOK_THEME: ${{ matrix.theme }}
        run: pnpm --filter @elabs-ai/components-docs test-storybook
      - name: Contract tests (axe + overflow, every theme and width)
        if: matrix.theme == 'light'
        run: pnpm --filter @elabs-ai/components-docs test-contract

  changes:
    name: Which paths changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      home: ${{ steps.diff.outputs.home }}
      create: ${{ steps.diff.outputs.create }}
      oses: ${{ steps.diff.outputs.oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # The website job runs on every push to main, and on a PR only when a path the
          # site is built from changed (RM-104). A push-to-main diff against
          # `github.event.before` misses the files of an earlier push whose run was
          # replaced in the queue before it started, which skipped the site twice.
          # The create matrix runs when the CLI, a package's manifest or build, or a
          # template changed, and on every push to main (RM-130).
          #
          # Create matrix OSes: Linux on every run. Windows and macOS only nightly, on a
          # manual run, and when the root version moves (the Version PR and its merge,
          # i.e. before a release). They passed 43 of 46 per-push runs while being what
          # every run waited for (up to 75 min).
          all_oses='["ubuntu-latest","macos-latest","windows-latest"]'
          oses='["ubuntu-latest"]'
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            oses="$all_oses"
          fi
          home=true
          create=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git diff "$BASE" "$GITHUB_SHA" -- package.json | grep -qE '^[-+][[:space:]]*"version":'; then
              oses="$all_oses"
            fi
            changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
            if [ "$EVENT" != "push" ] && ! echo "$changed" | grep -qE '^(apps/home/|packages/marketing/|packages/tokens/|registry/|scripts/gen-home\.mjs$|scripts/check/rules/home-bundle\.mjs$|\.github/workflows/ci\.yml$)'; then
              home=false
            fi
            if [ "$EVENT" != "push" ] && ! echo "$changed" | grep -qE '^(packages/cli/|packages/[^/]+/(package\.json|tsup\.config\.ts)$|docs/playbooks/templates/|scripts/create-matrix\.mjs$|scripts/lib/tsup-modules\.mjs$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
              create=false
            fi
          fi
          {
            echo "home=$home"
            echo "create=$create"
            echo "oses=$oses"
          } >> "$GITHUB_OUTPUT"
          echo "home=$home create=$create oses=$oses"

  create-pack:
    name: Create matrix — build and pack
    needs: changes
    if: ${{ needs.changes.outputs.create == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: pnpm turbo run build --filter=./packages/*
      # Built and packed once, on Linux, as a release is; every OS cell installs these.
      - name: Pack every package and the CLI
        run: node scripts/create-matrix.mjs --pack create-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: create-tarballs
          path: create-tarballs/
          retention-days: 1

  create-matrix:
    name: Create matrix (${{ matrix.os }}, ${{ matrix.pm }})
    needs: [changes, create-pack]
    runs-on: ${{ matrix.os }}
    # windows × npm is the slow cell: six apps, each installed twice (npm install,
    # then the app's own `npm ci`), took 41.4 min on 2026-09-19. Keep headroom.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Linux per run; Windows and macOS nightly and before a release (`changes`).
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
        pm: [npm, pnpm]
    steps:
      # No workspace install: the cell is a first-time user with Node and one
      # package manager, running the script from a bare checkout.
      - uses: actions/checkout@v4
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: create-tarballs
          path: create-tarballs
      # Every template, outside the workspace: create → install → the app's own CI
      # steps → build → audit --strict (scripts/create-matrix.mjs).
      - name: create → install → app CI → build → audit
        run: node scripts/create-matrix.mjs --pm ${{ matrix.pm }} --tarballs create-tarballs --json create-matrix.json
      - name: Upload the matrix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-matrix-${{ matrix.os }}-${{ matrix.pm }}
          path: create-matrix.json
          if-no-files-found: ignore
          retention-days: 14

  home:
    name: Website gates (e2e, Lighthouse, bundle)
    needs: [changes, quality]
    # Runs even when Quality fails, so the site gates report on their own. Quality's
    # Build step runs whatever failed before it, so the Storybook artifact is present
    # unless the build itself failed; then /storybook/ falls through to the site's
    # default rewrite (the PUBLISHED Storybook), not this commit's.
    if: ${{ always() && needs.changes.outputs.home == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Storybook build from the Quality job
        id: storybook
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - name: Serve Storybook for the /storybook/ rewrite
        if: steps.storybook.outcome == 'success'
        run: |
          nohup python3 -m http.server 6006 --directory storybook-static > /dev/null 2>&1 &
          echo "STORYBOOK_ORIGIN=http://localhost:6006" >> "$GITHUB_ENV"
      # No generated-artifacts check here: Quality runs it. Running it first here too
      # meant one stale file cancelled every site check below it.
      - name: Build the site
        run: pnpm --filter @elabs-ai/home build
      - name: Bundle budget (/ initial JS, per-section engines stay lazy)
        env:
          HOME_BUNDLE_REQUIRED: "1"
        run: |
          pnpm check --rule home-bundle
          pnpm --filter @elabs-ai/home bundle-budget
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/home exec playwright install --with-deps chromium firefox webkit
      - name: Playwright (smoke on three engines, theme sweep, a11y, keyboard, JS-off, motion)
        run: pnpm --filter @elabs-ai/home e2e
      - name: Lighthouse CI (desktop gate, mobile warning)
        run: pnpm --filter @elabs-ai/home lhci
      - name: Upload site reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-reports
          path: |
            apps/home/e2e/test-results/
            apps/home/e2e/playwright-report/
            apps/home/.next/.lighthouseci/
            apps/home/.next/bundle-budget.json
          if-no-files-found: ignore
          retention-days: 14
