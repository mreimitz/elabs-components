# CI: every quality check, on every PR and every push to main.
# What each step covers: docs/GATES.md. Release/publish lives in release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    if: false
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Check (rules + external commands)
        run: pnpm check
      - name: Check self-tests (rule fixtures + scripts/**/*.test.mjs)
        run: pnpm check:test
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Keep the Storybook build for the website job (/storybook/ smoke)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/docs/storybook-static/
          if-no-files-found: ignore
          retention-days: 1
      - name: Built-output checks (CSS assets, optional-peer types)
        run: |
          node scripts/check-css-assets.mjs
          node scripts/check-optional-peer-types.mjs
      - name: Generated artifacts are fresh
        run: pnpm gen:check
      - name: Consumer install smoke
        run: pnpm consumer:check

  storybook:
    name: Storybook interaction + axe (${{ matrix.theme }} ${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/components-docs exec playwright install --with-deps chromium
      - name: Story tests
        env:
          STORYBOOK_THEME: ${{ matrix.theme }}
          DEBUG: pw:browser
        run: |
          nproc; free -m; grep oom_kill /proc/vmstat
          ( while true; do echo "== $(date +%T) $(free -m | awk 'NR==2{print "used="$3" avail="$7}') $(grep oom_kill /proc/vmstat | tr '\n' ' ')"; ps -eo rss=,args= --sort=-rss | head -6 | awk '{printf "  %d MB %s\n", $1/1024, substr($0, index($0,$2), 140)}'; sleep 5; done ) > /tmp/mem.log 2>&1 &
          ( while true; do now=$(date +%s%3N); ps -eo pid=,rss=,args= | awk -v t=$now '/--type=renderer/{printf "RSS %s %s %d\n", t, $1, $2/1024}'; sleep 1; done ) > /tmp/rss.log 2>&1 &
          set -o pipefail
          pnpm --filter @elabs-ai/components-docs test-storybook 2>&1 | tee /tmp/sb.log
      - name: Diagnostics
        if: always()
        run: |
          echo "--- memory, last 4 minutes"; tail -340 /tmp/mem.log
          echo "--- peak used"; grep -oE "used=[0-9]+" /tmp/mem.log | sort -t= -k2 -n | tail -1
          echo "--- oom kills since boot"; grep oom_kill /proc/vmstat
          echo "--- per-tab rss"; cat /tmp/rss.log
          echo "--- probe"; grep -oE "LEAKPROBE .*" /tmp/sb.log
          echo "--- browser stderr"; grep -E "pw:browser" /tmp/sb.log | grep -vE "<launching>|<launched>" | tail -80 || true
      - name: Contract tests (axe + overflow, every theme and width)
        if: matrix.theme == 'light'
        run: pnpm --filter @elabs-ai/components-docs test-contract

  changes:
    name: Website paths changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      home: ${{ steps.diff.outputs.home }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The website job runs only when a path the site is built from changed (RM-104).
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "home=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" \
            | grep -qE '^(apps/home/|packages/marketing/|packages/tokens/|registry/|scripts/gen-home\.mjs$|scripts/check/rules/home-bundle\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "home=true" >> "$GITHUB_OUTPUT"
          else
            echo "home=false" >> "$GITHUB_OUTPUT"
          fi

  home:
    name: Website gates (e2e, Lighthouse, bundle)
    needs: [changes, quality]
    # Runs even when Quality fails, so the site gates report on their own; the Storybook
    # artifact is then simply absent and the /storybook/ smoke skips with a reason.
    if: ${{ always() && needs.changes.outputs.home == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Storybook build from the Quality job
        id: storybook
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - name: Serve Storybook for the /storybook/ rewrite
        if: steps.storybook.outcome == 'success'
        run: |
          nohup python3 -m http.server 6006 --directory storybook-static > /dev/null 2>&1 &
          echo "STORYBOOK_ORIGIN=http://localhost:6006" >> "$GITHUB_ENV"
      - name: Generated artifacts are fresh
        run: pnpm gen:check
      - name: Build the site
        run: pnpm --filter @elabs-ai/home build
      - name: Bundle budget (/ initial JS, per-section engines stay lazy)
        env:
          HOME_BUNDLE_REQUIRED: "1"
        run: |
          pnpm check --rule home-bundle
          pnpm --filter @elabs-ai/home bundle-budget
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/home exec playwright install --with-deps chromium firefox webkit
      - name: Playwright (smoke on three engines, theme sweep, a11y, keyboard, JS-off, motion)
        run: pnpm --filter @elabs-ai/home e2e
      - name: Lighthouse CI (desktop gate, mobile warning)
        run: pnpm --filter @elabs-ai/home lhci
      - name: Upload site reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-reports
          path: |
            apps/home/e2e/test-results/
            apps/home/e2e/playwright-report/
            apps/home/.next/.lighthouseci/
            apps/home/.next/bundle-budget.json
          if-no-files-found: ignore
          retention-days: 14
