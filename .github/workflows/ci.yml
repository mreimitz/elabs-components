# CI: every quality check, on every PR and every push to main.
# What each step covers: docs/GATES.md. Release/publish lives in release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Check (rules + external commands)
        run: pnpm check
      - name: Check self-tests (rule fixtures + scripts/**/*.test.mjs)
        run: pnpm check:test
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Keep the Storybook build for the website job (/storybook/ smoke)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/docs/storybook-static/
          if-no-files-found: ignore
          retention-days: 1
      - name: Built-output checks (CSS assets, optional-peer types)
        run: |
          node scripts/check-css-assets.mjs
          node scripts/check-optional-peer-types.mjs
      - name: Generated artifacts are fresh
        run: pnpm gen:check
      - name: Consumer install smoke
        run: pnpm consumer:check

  storybook:
    name: Storybook interaction + axe (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/components-docs exec playwright install --with-deps chromium
      - name: Story tests
        env:
          STORYBOOK_THEME: ${{ matrix.theme }}
        run: pnpm --filter @elabs-ai/components-docs test-storybook
      - name: Contract tests (axe + overflow, every theme and width)
        if: matrix.theme == 'light'
        run: pnpm --filter @elabs-ai/components-docs test-contract

  changes:
    name: Which paths changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      home: ${{ steps.diff.outputs.home }}
      create: ${{ steps.diff.outputs.create }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # The website job runs only when a path the site is built from changed (RM-104);
          # the create matrix when the CLI, a package's manifest or build, or a template
          # changed, and on every push to main (RM-130).
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "home=true" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          if echo "$changed" | grep -qE '^(apps/home/|packages/marketing/|packages/tokens/|registry/|scripts/gen-home\.mjs$|scripts/check/rules/home-bundle\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "home=true" >> "$GITHUB_OUTPUT"
          else
            echo "home=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" = "push" ] || echo "$changed" | grep -qE '^(packages/cli/|packages/[^/]+/(package\.json|tsup\.config\.ts)$|docs/playbooks/templates/|scripts/create-matrix\.mjs$|scripts/lib/tsup-modules\.mjs$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "create=true" >> "$GITHUB_OUTPUT"
          else
            echo "create=false" >> "$GITHUB_OUTPUT"
          fi

  create-pack:
    name: Create matrix — build and pack
    needs: changes
    if: ${{ needs.changes.outputs.create == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: pnpm turbo run build --filter=./packages/*
      # Built and packed once, on Linux, as a release is; every OS cell installs these.
      - name: Pack every package and the CLI
        run: node scripts/create-matrix.mjs --pack create-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: create-tarballs
          path: create-tarballs/
          retention-days: 1

  create-matrix:
    name: Create matrix (${{ matrix.os }}, ${{ matrix.pm }})
    needs: create-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pm: [npm, pnpm]
    steps:
      # No workspace install: the cell is a first-time user with Node and one
      # package manager, running the script from a bare checkout.
      - uses: actions/checkout@v4
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: create-tarballs
          path: create-tarballs
      # Every template, outside the workspace: create → install → the app's own CI
      # steps → build → audit --strict (scripts/create-matrix.mjs).
      - name: create → install → app CI → build → audit
        run: node scripts/create-matrix.mjs --pm ${{ matrix.pm }} --tarballs create-tarballs --json create-matrix.json
      - name: Upload the matrix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-matrix-${{ matrix.os }}-${{ matrix.pm }}
          path: create-matrix.json
          if-no-files-found: ignore
          retention-days: 14

  home:
    name: Website gates (e2e, Lighthouse, bundle)
    needs: [changes, quality]
    # Runs even when Quality fails, so the site gates report on their own; the Storybook
    # artifact is then simply absent and the /storybook/ smoke skips with a reason.
    if: ${{ always() && needs.changes.outputs.home == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Storybook build from the Quality job
        id: storybook
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - name: Serve Storybook for the /storybook/ rewrite
        if: steps.storybook.outcome == 'success'
        run: |
          nohup python3 -m http.server 6006 --directory storybook-static > /dev/null 2>&1 &
          echo "STORYBOOK_ORIGIN=http://localhost:6006" >> "$GITHUB_ENV"
      - name: Generated artifacts are fresh
        run: pnpm gen:check
      - name: Build the site
        run: pnpm --filter @elabs-ai/home build
      - name: Bundle budget (/ initial JS, per-section engines stay lazy)
        env:
          HOME_BUNDLE_REQUIRED: "1"
        run: |
          pnpm check --rule home-bundle
          pnpm --filter @elabs-ai/home bundle-budget
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/home exec playwright install --with-deps chromium firefox webkit
      - name: Playwright (smoke on three engines, theme sweep, a11y, keyboard, JS-off, motion)
        run: pnpm --filter @elabs-ai/home e2e
      - name: Lighthouse CI (desktop gate, mobile warning)
        run: pnpm --filter @elabs-ai/home lhci
      - name: Upload site reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-reports
          path: |
            apps/home/e2e/test-results/
            apps/home/e2e/playwright-report/
            apps/home/.next/.lighthouseci/
            apps/home/.next/bundle-budget.json
          if-no-files-found: ignore
          retention-days: 14
