# CI: every quality check, on every PR and every push to main.
# What each step covers: docs/GATES.md. Release/publish lives in release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Check (rules + external commands)
        run: pnpm check
      - name: Check self-tests (rule fixtures + scripts/**/*.test.mjs)
        run: pnpm check:test
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Built-output checks (CSS assets, optional-peer types)
        run: |
          node scripts/check-css-assets.mjs
          node scripts/check-optional-peer-types.mjs
      - name: Generated artifacts are fresh
        run: pnpm gen:check
      - name: Consumer install smoke
        run: pnpm consumer:check

  storybook:
    name: Storybook interaction + axe (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/components-docs exec playwright install --with-deps chromium
      - name: Story tests
        env:
          STORYBOOK_THEME: ${{ matrix.theme }}
        run: pnpm --filter @elabs-ai/components-docs test-storybook
