# The battery, run on every PR and every push to `main`.
#
# The FILE NAME is load-bearing: `scripts/check-release-verdict.mjs` looks up
# runs of `ci.yml` for the exact commit under a release tag (CI_WORKFLOW_FILE),
# and refuses to publish unless every blocking job of the newest such run
# concluded success. Renaming this file silently removes the release's only
# proof — change CI_WORKFLOW_FILE in the same commit if it ever moves.
#
# All gate steps live in the reusable `gates.yml`, never here: one place to add
# a gate, and `pnpm release-gates:check` can follow the `uses:` edge to see the
# whole set.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on a branch, but never on `main` — a `main` run is the
# verdict a future tag inherits, so it must be allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    # A reusable workflow can only be granted a SUBSET of the caller's own
    # permissions — GitHub's docs put it as "permissions can only be
    # maintained or reduced, not elevated, throughout the chain." Without
    # this block the job fell back to the repo's default workflow permission
    # ("Read repository contents and packages permissions" — restrictive),
    # which grants `contents: read` but NOT `pages: read`. `gates.yml`
    # requests both (#60, `registry:published:check`'s `isPagesConfigured()`),
    # so that request exceeded what this caller held and GitHub rejected the
    # whole run before any job started ("workflow file issue", 0 jobs, no
    # check runs) rather than merely denying the one step that needed it.
    # Declaring the same two scopes here is what lets the grant reach the
    # callee at all.
    permissions:
      contents: read # actions/checkout (gates.yml)
      pages: read # gh api repos/:owner/:repo/pages (registry:published:check)
    uses: ./.github/workflows/gates.yml
