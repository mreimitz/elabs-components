# Version and publish with Changesets (docs/RELEASING.md).
#
# Every push to `main` runs changesets/action:
#   - pending changesets in `.changeset/`  → open/update the "Version Packages" PR
#     (`pnpm changeset:version`: bump the fixed group, stamp root + plugin + MCP
#     versions, refresh the lockfile). Nothing publishes.
#   - no pending changesets (that PR was just merged) → `pnpm release:publish`
#     publishes every fixed-group version not yet on npm, tags it and creates the
#     GitHub Releases. When nothing is new, it publishes nothing.
#
# The quality battery is `ci.yml`, EXCEPT for the one job a release cannot be
# allowed to outrun (`storybook-gate` below). What this workflow also checks is the
# artefact: the post-publish fresh-install smoke installs what the registry serves,
# and the post-deploy story crawl opens what the docs site serves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # manual rerun, e.g. after adding a missing secret
    inputs:
      deploy-docs:
        description: Redeploy the LATEST RELEASED Storybook to Vercel production
        type: boolean
        default: false
      deploy-home:
        description: Redeploy the LATEST RELEASED website + hosted MCP to Vercel production
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version commit, tags, GitHub Releases, release assets
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance (best-effort; see the changesets step)

jobs:
  # ── The one gate a release may not outrun ────────────────────────────────────
  #
  # `ci.yml` and this workflow are BOTH triggered by the push to `main`, and
  # nothing connects them: they are separate workflows, so a red CI run does not
  # stop a publish. `main` also carries no required status checks
  # (`gh api repos/:owner/:repo/branches/main/protection` → no
  # `required_status_checks`), which is what makes a direct push to `main`
  # possible in the first place. The result, measured on 2026-09-17: the live
  # docs site was serving stories whose play functions THREW, published by a
  # release whose own workflow was green, because the only job that would have
  # caught them ran somewhere else and was advisory.
  #
  # So the Storybook run is duplicated here on purpose — it is the same command
  # ci.yml runs, and `release` needs it. A red story run now fails the release
  # workflow itself, with no repository setting in the loop. (Making it a
  # REQUIRED CHECK on `main` as well is a repo-settings change and is the other
  # half of this fix; see docs/RELEASING.md § Gates.)
  storybook-gate:
    name: Storybook interaction + axe (release gate, ${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/components-docs exec playwright install --with-deps chromium
      - name: Story tests
        env:
          STORYBOOK_THEME: ${{ matrix.theme }}
        run: pnpm --filter @elabs-ai/components-docs test-storybook

  release:
    name: Version or publish
    needs: storybook-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@elabs-ai"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Will this run publish? Only when no changesets are pending AND some
      # distributable's tree version is not on npm yet (this also resumes a partial
      # publish). Otherwise the publish script is left unset, so a routine push to
      # `main` neither builds the packages nor needs the npm credential.
      - name: Release mode
        id: mode
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')"
          publish=false
          if [ "$pending" = "0" ]; then
            for spec in $(node --input-type=module -e "import { distributablePackages } from './scripts/lib/distributables.mjs'; for (const p of distributablePackages()) console.log(p.name + '@' + p.version)"); do
              if ! npm view "$spec" version >/dev/null 2>&1; then
                echo "not on npm yet: $spec"
                publish=true
              fi
            done
          fi
          echo "pending changesets: $pending; publish: $publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # ── AUTH, PROVED BEFORE THE IRREVERSIBLE STEP. `NODE_AUTH_TOKEN` is inert on
      #    its own; setup-node writes the auth line only because `registry-url` is
      #    set, and pnpm reads ~/.npmrc directly, so the line goes there too. A
      #    missing or wrong token fails here, where the fix is free.
      - name: Registry authentication
        if: steps.mode.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::secrets.NPM_TOKEN is empty — the publish would fail with ENEEDAUTH." >&2
            echo "Add an npm automation token with publish rights for @elabs-ai as the NPM_TOKEN repository secret." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" >> "${HOME}/.npmrc"
          echo "npm identity: $(npm whoami --registry https://registry.npmjs.org)"

      # `access: public` lives in .changeset/config.json (a scoped package defaults to
      # restricted). NPM_CONFIG_PROVENANCE is an env var, not a flag, so a pnpm that
      # ignores it still publishes (unattested) instead of aborting mid-release.
      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: ${{ steps.mode.outputs.publish == 'true' && 'pnpm release:publish' || '' }}
          commit-message: "release: version packages"
          pr-title: "Release: version packages"
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # ── after a publish: attach the agent kit + plugin zips to the CLI's release ─
      - name: Build and attach the agent kit and plugin
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm release:agent-kit
          pnpm release:plugin
          gh release upload "@elabs-ai/components-cli@${version}" \
            "release/v${version}/brand-ui-agent-kit-${version}.zip" \
            "release/v${version}/brand-ui-plugin-${version}.zip" --clobber

      # ── the check `npm view` cannot make: install what the registry SERVES ─────
      - name: Post-release fresh-install smoke
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          printf '%s' "$PUBLISHED_PACKAGES" > "$RUNNER_TEMP/published-packages.json"
          pnpm release:smoke --manifest "$RUNNER_TEMP/published-packages.json"

  # ── deploy the released Storybook to Vercel production ─────────────────────
  #
  # TWO Vercel projects, one repo (ADR 0038 § operations):
  #
  #   elabs-storybook  root apps/docs  →  storybook.elabs-ai.com   (this job)
  #   elabs-components root apps/home  →  elabs-components.vercel.app
  #                                       + elabs-ai.com           (deploy-home)
  #
  # The WEBSITE owns the public addresses and reaches Storybook by rewriting
  # /storybook/:path* to storybook.elabs-ai.com, so this job must land BEFORE
  # deploy-home — otherwise the site's /storybook would serve the previous release
  # for as long as the two deploys are apart.
  #
  # Vercel's Git integration is OFF for both projects (`git.deploymentEnabled:
  # false` in each app's vercel.json), so a push to `main` never deploys: production
  # only ever serves a released version, and keeps the previous one until the next
  # release. This job deploys the newest `@elabs-ai/components-cli@<version>` tag —
  # the release commit itself — so an unreleased commit on `main` cannot ride along.
  # The build runs on Vercel with the project's settings (root apps/docs).
  #
  # `.vercelignore` at the repo root is load-bearing for both jobs: the CLI uploads
  # from the repo root and does NOT read .gitignore, and without it the deployment's
  # file manifest — one request, 10 MB limit — is rejected outright.
  #
  # Runs whenever the npm publish itself succeeded — `!cancelled()` opts out of the
  # default `needs:` gate, so a failure in a post-publish step of `release` (which
  # cannot undo the publish) does not withhold the deploy for packages already out.
  # Also runs from a manual run with the `deploy-docs` input.
  deploy-docs:
    name: Deploy Storybook to Vercel
    needs: release
    if: ${{ !cancelled() && (needs.release.outputs.published == 'true' || inputs.deploy-docs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_CREpBGwTjqJ21Rj1cpNRTPCv # elabs-ai (not a secret)
      VERCEL_PROJECT_ID: prj_D84K8BP6ySAwJHFmNEeaX2lbwpBj # elabs-storybook (not a secret)
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify Vercel deploy credential
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::secrets.VERCEL_TOKEN is empty — the released Storybook cannot be" >&2
            echo "deployed. Create a token scoped to the elabs-ai team (vercel.com/account/tokens)" >&2
            echo "and add it as the VERCEL_TOKEN repository secret, then re-run with deploy-docs." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the latest release tag
        id: tag
        run: |
          git fetch --tags --force
          tag="$(git tag -l '@elabs-ai/components-cli@*' --sort=-v:refname | head -1)"
          if [ -z "$tag" ]; then
            echo "::error::no @elabs-ai/components-cli@<version> tag — nothing released to deploy." >&2
            exit 1
          fi
          git checkout --quiet "$tag"
          echo "deploying $tag ($(git rev-parse --short HEAD))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        id: deploy
        run: |
          url="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            --meta releaseTag="${{ steps.tag.outputs.tag }}")"
          echo "deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The Storybook project carries its own copy of the hosted MCP (apps/docs/api/mcp.mjs),
      # which is what proves the deployment that just went live is built from the release
      # tag rather than left over from the previous one. The MCP a consumer is told to add
      # is the WEBSITE's (`elabs-ai.com/mcp`); deploy-home asserts that one.
      # (The per-deployment URL can sit behind Vercel Deployment Protection;
      # `deploy --prod` returns only after the alias points here.)
      - name: Smoke the hosted MCP
        env:
          PRODUCTION_URL: https://storybook.elabs-ai.com
        run: |
          expected="${{ steps.tag.outputs.tag }}"; expected="${expected##*@}"
          body="$(curl -fsS --retry 3 --retry-delay 10 -X POST "${PRODUCTION_URL}/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}')"
          echo "$body"
          echo "$body" | grep -q "\"version\":\"${expected}\"" \
            || { echo "::error::hosted MCP does not report version ${expected}" >&2; exit 1; }

      # The docs site is the other artefact this job just published, and until
      # now nothing ever opened it. `--stories-only` loads every story from the
      # deployed `index.json` in Chromium and fails on a visible error overlay,
      # an uncaught page error, or a chart that measured to nothing — the exact
      # three symptoms the 2026-09-17 crawl found on a green release
      # (scripts/lib/story-crawl.mjs).
      #
      # The deploy itself runs on Vercel, so this job had no toolchain of its own
      # until here; the crawl needs one (Playwright is apps/docs's devDependency).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/components-docs exec playwright install --with-deps chromium
      - name: Smoke the published stories
        run: node scripts/release-smoke.mjs --stories-only --stories https://storybook.elabs-ai.com

  # ── deploy the released website + hosted MCP to Vercel production ───────────
  #
  # The website owns both public addresses (`elabs-components.vercel.app` and
  # `elabs-ai.com`), serves `/mcp` from its own route, and reaches Storybook by
  # rewriting `/storybook/:path*` to the Storybook project — so it must go out AFTER
  # deploy-docs, or the site's `/storybook` would serve the previous release for as
  # long as the two deploys are apart. `needs` therefore lists deploy-docs, and
  # `!cancelled()` lets this run even when deploy-docs failed: a website that is a
  # release behind on Storybook is still better than one that is a release behind
  # everywhere.
  #
  # Nothing in either build log can tell whether the arrangement actually holds —
  # a rewrite pointing at a dead origin, a project whose Root Directory was never
  # switched, and a domain still aliased to the old deployment all deploy GREEN and
  # answer 200. `scripts/site-smoke.mjs` is the check that can tell, and it runs
  # against BOTH public addresses because the two must behave identically.
  deploy-home:
    name: Deploy the website + hosted MCP to Vercel
    needs: [release, deploy-docs]
    if: ${{ !cancelled() && (needs.release.outputs.published == 'true' || inputs.deploy-home) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_CREpBGwTjqJ21Rj1cpNRTPCv # elabs-ai (not a secret)
      VERCEL_PROJECT_ID: prj_vAhDf9Ako9r9kiLJQqCQQXOPdTp8 # elabs-components (not a secret)
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify Vercel deploy credential
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::secrets.VERCEL_TOKEN is empty — the released website and hosted MCP cannot" >&2
            echo "be deployed. Create a token scoped to the elabs-ai team (vercel.com/account/tokens)" >&2
            echo "and add it as the VERCEL_TOKEN repository secret, then re-run with deploy-home." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the latest release tag
        id: tag
        run: |
          git fetch --tags --force
          tag="$(git tag -l '@elabs-ai/components-cli@*' --sort=-v:refname | head -1)"
          if [ -z "$tag" ]; then
            echo "::error::no @elabs-ai/components-cli@<version> tag — nothing released to deploy." >&2
            exit 1
          fi
          git checkout --quiet "$tag"
          echo "deploying $tag ($(git rev-parse --short HEAD))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        id: deploy
        run: |
          url="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            --meta releaseTag="${{ steps.tag.outputs.tag }}")"
          echo "deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The smoke needs a toolchain (Playwright is apps/docs's devDependency); the
      # deploy itself ran on Vercel, so this job had none until here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @elabs-ai/components-docs exec playwright install --with-deps chromium

      # Both addresses, same expectations, sampled story crawl through the rewrite on
      # the canonical one. A failure here means the site a consumer opens is wrong,
      # whatever the deploy said.
      - name: Smoke the Vercel address
        run: |
          node scripts/site-smoke.mjs https://elabs-components.vercel.app \
            --version "${{ steps.tag.outputs.version }}"
      - name: Smoke the custom domain
        run: |
          node scripts/site-smoke.mjs https://elabs-ai.com \
            --version "${{ steps.tag.outputs.version }}" --stories 30
