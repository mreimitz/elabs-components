# Version and publish with Changesets (docs/RELEASING.md).
#
# Every push to `main` runs changesets/action:
#   - pending changesets in `.changeset/`  → open/update the "Version Packages" PR
#     (`pnpm changeset:version`: bump the fixed group, stamp root + plugin + MCP
#     versions, refresh the lockfile). Nothing publishes.
#   - no pending changesets (that PR was just merged) → `pnpm release:publish`
#     publishes every fixed-group version not yet on npm, tags it and creates the
#     GitHub Releases. When nothing is new, it publishes nothing.
#
# The quality battery is `ci.yml` on the PRs that land on `main`; this workflow does
# not re-run it. What it DOES check is the artefact: the post-publish fresh-install
# smoke installs what the registry serves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # manual rerun, e.g. after adding a missing secret
    inputs:
      deploy-docs:
        description: Redeploy the LATEST RELEASED docs + hosted MCP to Vercel production
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version commit, tags, GitHub Releases, release assets
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance (best-effort; see the changesets step)

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@elabs-ai"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Will this run publish? Only when no changesets are pending AND some
      # distributable's tree version is not on npm yet (this also resumes a partial
      # publish). Otherwise the publish script is left unset, so a routine push to
      # `main` neither builds the packages nor needs the npm credential.
      - name: Release mode
        id: mode
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')"
          publish=false
          if [ "$pending" = "0" ]; then
            for spec in $(node --input-type=module -e "import { distributablePackages } from './scripts/lib/distributables.mjs'; for (const p of distributablePackages()) console.log(p.name + '@' + p.version)"); do
              if ! npm view "$spec" version >/dev/null 2>&1; then
                echo "not on npm yet: $spec"
                publish=true
              fi
            done
          fi
          echo "pending changesets: $pending; publish: $publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # ── AUTH, PROVED BEFORE THE IRREVERSIBLE STEP. `NODE_AUTH_TOKEN` is inert on
      #    its own; setup-node writes the auth line only because `registry-url` is
      #    set, and pnpm reads ~/.npmrc directly, so the line goes there too. A
      #    missing or wrong token fails here, where the fix is free.
      - name: Registry authentication
        if: steps.mode.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::secrets.NPM_TOKEN is empty — the publish would fail with ENEEDAUTH." >&2
            echo "Add an npm automation token with publish rights for @elabs-ai as the NPM_TOKEN repository secret." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" >> "${HOME}/.npmrc"
          echo "npm identity: $(npm whoami --registry https://registry.npmjs.org)"

      # `access: public` lives in .changeset/config.json (a scoped package defaults to
      # restricted). NPM_CONFIG_PROVENANCE is an env var, not a flag, so a pnpm that
      # ignores it still publishes (unattested) instead of aborting mid-release.
      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: ${{ steps.mode.outputs.publish == 'true' && 'pnpm release:publish' || '' }}
          commit-message: "release: version packages"
          pr-title: "Release: version packages"
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # ── after a publish: attach the agent kit + plugin zips to the CLI's release ─
      - name: Build and attach the agent kit and plugin
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm release:agent-kit
          pnpm release:plugin
          gh release upload "@elabs-ai/components-cli@${version}" \
            "release/v${version}/brand-ui-agent-kit-${version}.zip" \
            "release/v${version}/brand-ui-plugin-${version}.zip" --clobber

      # ── the check `npm view` cannot make: install what the registry SERVES ─────
      - name: Post-release fresh-install smoke
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          printf '%s' "$PUBLISHED_PACKAGES" > "$RUNNER_TEMP/published-packages.json"
          pnpm release:smoke --manifest "$RUNNER_TEMP/published-packages.json"

  # ── host the built shadcn registry on GitHub Pages (#31) ───────────────────
  #
  # Runs whenever the npm publish itself succeeded — `!cancelled()` opts out of the
  # default `needs:` gate, so a failure in a post-publish step above (which cannot
  # undo the publish) does not withhold the registry for packages already out.
  #
  # A push made with the default GITHUB_TOKEN does not trigger a Pages "Deploy from
  # a branch" build, so checkout uses PAGES_DEPLOY_TOKEN and the first step proves it
  # exists. This does not enable Pages; that is a one-time repo setting (#31).
  publish-registry:
    name: Publish the registry to GitHub Pages
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify Pages deploy credential
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "${PAGES_DEPLOY_TOKEN}" ]; then
            echo "::error::secrets.PAGES_DEPLOY_TOKEN is empty — a push made with the default" >&2
            echo "GITHUB_TOKEN does not trigger a GitHub Pages 'Deploy from a branch' build," >&2
            echo "so the hosted registry would never update. Add a fine-grained PAT (Contents:" >&2
            echo "Read and write on this repo) as the PAGES_DEPLOY_TOKEN repository secret." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the registry
        run: pnpm registry:build

      - name: Publish to gh-pages
        run: pnpm registry:publish

  # ── deploy the released Storybook + hosted MCP to Vercel production ────────
  #
  # Vercel's Git integration is OFF for this project (`git.deploymentEnabled:
  # false` in apps/docs/vercel.json), so a push to `main` never deploys: production
  # only ever serves a released version, and keeps the previous one until the next
  # release. This job deploys the newest `@elabs-ai/components-cli@<version>` tag —
  # the release commit itself — so an unreleased commit on `main` cannot ride along.
  # The build runs on Vercel with the project's settings (root apps/docs).
  #
  # Runs after a successful npm publish (same `!cancelled()` reasoning as
  # publish-registry), or from a manual run with the `deploy-docs` input.
  deploy-docs:
    name: Deploy docs + hosted MCP to Vercel
    needs: release
    if: ${{ !cancelled() && (needs.release.outputs.published == 'true' || inputs.deploy-docs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_CREpBGwTjqJ21Rj1cpNRTPCv # elabs-ai (not a secret)
      VERCEL_PROJECT_ID: prj_vAhDf9Ako9r9kiLJQqCQQXOPdTp8 # elabs-components (not a secret)
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify Vercel deploy credential
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::secrets.VERCEL_TOKEN is empty — the released docs and hosted MCP cannot be" >&2
            echo "deployed. Create a token scoped to the elabs-ai team (vercel.com/account/tokens)" >&2
            echo "and add it as the VERCEL_TOKEN repository secret, then re-run with deploy-docs." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the latest release tag
        id: tag
        run: |
          git fetch --tags --force
          tag="$(git tag -l '@elabs-ai/components-cli@*' --sort=-v:refname | head -1)"
          if [ -z "$tag" ]; then
            echo "::error::no @elabs-ai/components-cli@<version> tag — nothing released to deploy." >&2
            exit 1
          fi
          git checkout --quiet "$tag"
          echo "deploying $tag ($(git rev-parse --short HEAD))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        id: deploy
        run: |
          url="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            --meta releaseTag="${{ steps.tag.outputs.tag }}")"
          echo "deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The public production address must now serve the hosted MCP at the version
      # just released. (The per-deployment URL can sit behind Vercel Deployment
      # Protection; `deploy --prod` returns only after the alias points here.)
      - name: Smoke the hosted MCP
        env:
          PRODUCTION_URL: https://elabs-components-elabs-ai.vercel.app
        run: |
          expected="${{ steps.tag.outputs.tag }}"; expected="${expected##*@}"
          body="$(curl -fsS --retry 3 --retry-delay 10 -X POST "${PRODUCTION_URL}/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}')"
          echo "$body"
          echo "$body" | grep -q "\"version\":\"${expected}\"" \
            || { echo "::error::hosted MCP does not report version ${expected}" >&2; exit 1; }
