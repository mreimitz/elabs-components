<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="brand-ui">
  <!-- SIMPLIFIED small-size variant — deliberately NOT full parity with BrandLogo.
       A browser tab renders a favicon at 16px on a standard display, where the
       full mark's 45° hatch fuses into a textureless blob (issue #2, maintainer
       decision 2026-08-30): the hatch lines, the two stray strokes and the two
       register dots are dropped here, keeping only the circle-over-square
       silhouette, and the square's fill-opacity is raised (0.22 -> 0.6, this
       asset only) so the plane still reads as a plane once the hatch that used
       to carry its texture is gone. The circle+square COORDINATES stay
       byte-identical to BrandLogo's SQUARE/CIRCLE constants
       (packages/icons/src/brand-logo.tsx) — brand-mark-assets.test.tsx checks
       this. Do not add the hatch/dots/stray strokes back to "restore parity";
       that was the illegible drawing this file exists to avoid.

       Kept in sync BY HAND with BrandLogo: a browser tab renders this file
       outside the app, so it can neither use the component nor read the token
       stylesheet. The component's two inks become literals here.

       Only the INK follows the browser's colour scheme (the closest available
       stand-in for currentColor). The plane is the bright brand plate in both,
       exactly as the brand-mark-tail token resolves in the component. The hexes
       are the sRGB of the light/dark foreground token and of the primary token.

       Stroke and fill are SEPARATE classes on purpose. A CSS rule beats a
       presentation attribute, so a single ".ink { fill; stroke }" would override
       fill="none" on the circle and paint it as a solid disc.

       NOTE: an XML comment may not contain a double hyphen, so token names are
       written here without their CSS custom-property prefix. A stray "- -" pair
       makes this file unparseable as an image and the tab icon silently blank. -->
  <style>
    .ink-stroke { stroke: #404040; }
    .plane { fill: #D0E268; stroke: #D0E268; }
    @media (prefers-color-scheme: dark) {
      .ink-stroke { stroke: #F1F2F4; }
    }
  </style>
  <rect class="plane" x="5.5" y="21.5" width="37" height="37" fill-opacity="0.6" stroke-width="2.2" stroke-dasharray="4.5 4.5" stroke-linecap="square" />
  <circle class="ink-stroke" cx="42" cy="23" r="19.5" fill="none" stroke-width="2.4" />
</svg>
