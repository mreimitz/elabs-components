<svg xmlns="http://www.w3.org/2000/svg" width="94" height="28" viewBox="0 0 215 64" role="img" aria-label="brand-ui">
  <!-- Storybook manager chrome. Kept in sync BY HAND with BrandLogo
       (packages/icons/src/brand-logo.tsx) — the manager renders outside React,
       so it cannot use the component. The chrome is pinned dark
       (manager.ts base:"dark"), so the drawn linework is white and the
       construction square is the bright brand plate, the same value the
       brand-mark-tail token resolves to in the component.

       The wordmark is OUTLINED, not text: this file is loaded as an img, so it
       never sees the token stylesheet's self-hosted Inter and would render — and
       clip — against whatever fallback the manager happens to have. Outlines from
       Inter SemiBold at 30px; regenerate them if the wordmark changes.

       NOTE: an XML comment may not contain a double hyphen, so token names are
       written here without their CSS custom-property prefix. A stray "- -" pair
       makes this file unparseable as an image and the manager logo silently
       blank. -->
  <defs>
    <clipPath id="brand-logo-hatch">
      <circle cx="42" cy="23" r="19.5" />
    </clipPath>
  </defs>
  <rect x="5.5" y="21.5" width="37" height="37" fill="#D0E268" fill-opacity="0.22" stroke="#D0E268" stroke-width="2.2" stroke-dasharray="4.5 4.5" stroke-linecap="square" />
  <g stroke="#FFFFFF" fill="none" stroke-width="1.8" clip-path="url(#brand-logo-hatch)">
    <line x1="-22" y1="64" x2="42" y2="0" />
    <line x1="-15" y1="64" x2="49" y2="0" />
    <line x1="-8" y1="64" x2="56" y2="0" />
    <line x1="-1" y1="64" x2="63" y2="0" />
    <line x1="6" y1="64" x2="70" y2="0" />
    <line x1="13" y1="64" x2="77" y2="0" />
    <line x1="20" y1="64" x2="84" y2="0" />
    <line x1="27" y1="64" x2="91" y2="0" />
  </g>
  <circle cx="42" cy="23" r="19.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" />
  <circle cx="34.5" cy="30" r="2.2" fill="#FFFFFF" />
  <circle cx="44.5" cy="47" r="2.2" fill="#FFFFFF" />
  <g stroke="#FFFFFF" fill="none" stroke-width="1.8" stroke-linecap="round">
    <line x1="48" y1="58" x2="53.5" y2="52.5" />
    <line x1="55" y1="50" x2="60.5" y2="44.5" />
  </g>
