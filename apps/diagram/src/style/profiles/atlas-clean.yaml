profile: atlas-clean
schemaVersion: 1
lens: technical
title: Atlas Clean
fidelity: approximate
source: Atlas semantic token conventions
ground:
  fill: var(--background)
  followTheme: true
typography:
  text: var(--foreground)
  muted: var(--muted-foreground)
  family: inherit
  emphasis: weight
roles:
  hero:
    fill: var(--card)
    text: var(--foreground)
    stroke: var(--border)
  other:
    fill: var(--card)
    text: var(--foreground)
    stroke: var(--border)
  generic:
    fill: var(--card)
    text: var(--foreground)
    stroke: var(--border)
  sub:
    fill: var(--card)
    text: var(--foreground)
    stroke: var(--border)
  zone:
    fill: var(--card)
    text: var(--foreground)
    stroke: var(--border)
owners:
  customer:
    fill: var(--surface-muted)
    text: var(--foreground)
    stroke: var(--border)
  saas:
    fill: var(--card)
    text: var(--foreground)
    stroke: var(--border)
  hosted:
    fill: var(--background)
    text: var(--foreground)
    stroke: var(--border-strong)
  partner:
    fill: var(--background)
    text: var(--foreground)
    stroke: var(--border-strong)
  unowned:
    fill: var(--background)
    text: var(--foreground)
    stroke: var(--border-strong)
zones:
  radius: 8
  accentHeight: 0
  accents:
    vendor-cloud: var(--border)
    sources: var(--border)
    customer-managed: var(--border)
    customer-vpc: var(--border)
    targets: var(--border)
boxes:
  anatomy: capability-list
  title:
    weight: 600
    align: left
  items:
    icon: brand
    bullet: none
pills:
  enabled: true
  fill: var(--muted)
  text: var(--muted-foreground)
  vocabulary:
    - landing
    - storage
    - mirror
    - transform
    - elt
    - replication
    - quality
  fromTags:
    object-storage: storage
    etl: transform
    cdc: replication
flows:
  data:
    stroke: var(--muted-foreground)
    width: 1.5
    dash: none
    marker: arrow
  control:
    stroke: var(--muted-foreground)
    width: 1.5
    dash: 6 4
    marker: arrow
  routing: orthogonal
  arrowheads: both-when-bidirectional
layout:
  direction: LR
  controlPlane: top
  lanes:
    - sources
    - customer-managed
    - customer-vpc
    - targets
  grid: 8
forbid:
  - per-node-colour
  - diagonal-edges
