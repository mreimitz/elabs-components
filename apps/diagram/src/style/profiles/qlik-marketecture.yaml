profile: qlik-marketecture
schemaVersion: 1
lens: visual
title: Qlik Marketecture
fidelity: approximate
source: Qlik Style Guide July 2026; contrast-safe green and dark pill text are deliberate adaptations
ground:
  fill: "#0E2340"
  followTheme: false
typography:
  text: "#FFFFFF"
  muted: "#A9B3B6"
  family: Inter
  emphasis: weight
roles:
  hero:
    fill: "#007A38"
    text: "#FFFFFF"
    stroke: transparent
  other:
    fill: "#1E4E78"
    text: "#FFFFFF"
    stroke: transparent
  generic:
    fill: "#1E4E78"
    text: "#FFFFFF"
    stroke: transparent
  sub:
    fill: none
    text: "#FFFFFF"
    stroke: "#FFFFFF"
  zone:
    fill: "#142D4A"
    text: "#A9B3B6"
    stroke: transparent
owners:
  customer:
    fill: var(--surface-muted)
    text: var(--foreground)
    stroke: var(--border)
  saas:
    fill: var(--card)
    text: var(--foreground)
    stroke: var(--border)
  hosted:
    fill: var(--background)
    text: var(--foreground)
    stroke: var(--border-strong)
  partner:
    fill: var(--background)
    text: var(--foreground)
    stroke: var(--border-strong)
  unowned:
    fill: var(--background)
    text: var(--foreground)
    stroke: var(--border-strong)
zones:
  radius: 6
  accentHeight: 4
  accents:
    vendor-cloud: "#009845"
    sources: "#A9B3B6"
    customer-managed: "#93579C"
    customer-vpc: "#10CFC9"
    targets: "#10CFC9"
boxes:
  anatomy: capability-list
  title:
    weight: 700
    align: center
  items:
    icon: semantic
    bullet: ring
pills:
  enabled: true
  fill: "#10CFC9"
  text: "#0E2340"
  vocabulary:
    - landing
    - storage
    - mirror
    - transform
    - elt
    - replication
    - quality
  fromTags:
    object-storage: storage
    etl: transform
    cdc: replication
flows:
  data:
    stroke: "#FFFFFF"
    width: 1
    dash: none
    marker: arrow
  control:
    stroke: "#FFFFFF"
    width: 1
    dash: 6 5
    marker: arrow
  routing: orthogonal
  arrowheads: both-when-bidirectional
layout:
  direction: LR
  controlPlane: top
  lanes:
    - sources
    - customer-managed
    - customer-vpc
    - targets
  grid: 8
forbid:
  - per-node-colour
  - accent-as-fill
  - diagonal-edges
  - coloured-arrows
  - new-pill-labels
vendor: qlik
