# yaml-language-server: $schema=../../schema/arch-diagram.v1.schema.json
diagram: "1"
title: Lakehouse on AWS with Databricks and Snowflake
description: How raw data lands in S3, is cataloged by Glue and processed by Databricks jobs into Snowflake, then queried by Qlik Cloud.
direction: LR
nodeStyle: icon
legend: auto

zones:
  - id: aws
    kind: cloud-account
    owner: customer
    provider: aws
    title: AWS account
    children:
      - id: vpc
        kind: vnet
        title: VPC 10.0.0.0/16
        children:
          - id: private
            kind: subnet
            title: Private subnet
            children:
              - id: postgres-rds
                type: datastore
                ref: catalog/aws/rds
                title: Postgres (RDS)
                subtitle: OLTP source
              - id: msk
                type: queue
                ref: catalog/aws/managed-streaming-for-apache-kafka
                title: Amazon MSK
                subtitle: Kafka
              - id: dbx-jobs
                ref: catalog/databricks/jobs
                title: Databricks jobs
                subtitle: Classic compute
          - id: nat
            icon: aws/virtual-private-cloud # a stand-in: a NAT gateway, not the VPC, so no ref (maintainer, 2026-09-27)
            title: NAT gateway
            subtitle: Egress
      - id: s3-landing
        type: datastore
        ref: catalog/aws/simple-storage-service
        title: S3 — landing
        subtitle: Object storage
      - id: glue
        ref: catalog/aws/glue
        subtitle: ETL
      - id: s3-curated
        type: datastore
        ref: catalog/aws/simple-storage-service
        title: S3 — curated
        subtitle: Object storage
      - id: iam
        ref: catalog/aws/identity-and-access-management
        title: IAM
        subtitle: Identity
  - id: databricks
    kind: cloud-account
    owner: saas
    provider: databricks
    title: Databricks (SaaS)
    children:
      - id: dbx-workspace
        ref: catalog/databricks/workspace
        title: Databricks workspace
        subtitle: Control plane
  - id: snowflake
    kind: cloud-account
    owner: saas
    provider: snowflake
    title: Snowflake (SaaS)
    children:
      - id: snow-db
        ref: catalog/snowflake/database
        title: Snowflake DB
        subtitle: Storage
      - id: snow-wh
        ref: catalog/snowflake/warehouse
        title: Snowflake warehouse
        subtitle: Compute

nodes:
  - id: okta
    type: external
    icon: lucide/key
    title: Okta
    subtitle: SSO
  - id: qlik-cloud
    ref: catalog/qlik/cloud
    title: Qlik Cloud
    subtitle: SaaS
  - id: salesforce
    type: external
    ref: catalog/salesforce/salesforce
    subtitle: SaaS
    tone: info

flows:
  - salesforce -> s3-landing: AppFlow export
  - postgres-rds -> msk: CDC
  - msk -> s3-landing: Stream
  - s3-landing -> glue: Catalog
  - glue -> s3-curated: ETL
  # Written reversed: the jobs read curated S3, but they sit in the VPC with the sources,
  # so the forward edge made a VPC -> S3 -> VPC cycle and ELK flipped the Catalog step instead.
  - dbx-jobs <- s3-curated: Load
  - dbx-workspace -> dbx-jobs: { label: Schedule and run, kind: control }
  - dbx-jobs -> snow-db: Write
  - snow-db -> snow-wh: Query
  - snow-wh -> qlik-cloud: Direct Query
  - okta -> qlik-cloud: { label: SSO, kind: access, secure: sso }
  - iam -> glue: { label: IAM role, kind: access }
  - nat -> dbx-workspace: { label: Egress, kind: network }
  - vpc -> snowflake: { label: PrivateLink, kind: network, secure: private-link }
