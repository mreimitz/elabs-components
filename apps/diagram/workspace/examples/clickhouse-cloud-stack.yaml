# yaml-language-server: $schema=../../schema/arch-diagram.v1.schema.json
#
# Real-time analytics on ClickHouse Cloud. Change events leave the customer's Postgres
# through a Confluent Cloud CDC connector, ClickPipes ingests the topic into ClickHouse
# Cloud in the customer's region, and dashboards query it over PrivateLink. The story
# follows one order from capture through analytics and its cold archive.
diagram: "1"
title: Real-time analytics on ClickHouse Cloud
description: How one order’s change event travels from Postgres through Confluent Cloud CDC into ClickHouse Cloud and out to a dashboard.
direction: LR
nodeStyle: icon
legend: auto

zones:
  - id: aws
    kind: cloud-account
    owner: customer
    provider: aws
    title: AWS account
    children:
      - id: region
        kind: region
        title: eu-central-1
        children:
          - id: orders-db
            type: datastore
            ref: catalog/aws/rds
            title: Orders DB
            subtitle: RDS for PostgreSQL
          - id: grafana
            icon: lucide/activity
            title: Grafana
            subtitle: Ops dashboards
          - id: superset
            icon: lucide/bar-chart
            title: Apache Superset
            subtitle: Self-service BI
          - id: endpoint
            ref: catalog/aws/privatelink
            title: VPC endpoint
            subtitle: PrivateLink
          - id: archive
            type: datastore
            ref: catalog/aws/simple-storage-service
            title: S3 archive
            subtitle: Cold exports
  - id: confluent
    kind: cloud-account
    owner: hosted
    title: Confluent Cloud
    subtitle: Dedicated cluster
    direction: LR
    children:
      - id: cdc
        icon: lucide/plug
        title: PostgreSQL CDC
        subtitle: Source V2 (Debezium)
      - id: topics
        type: queue
        icon: lucide/radio
        title: Kafka topics
        subtitle: orders.*
  - id: clickhouse
    kind: region
    owner: saas
    provider: clickhouse
    title: ClickHouse Cloud
    subtitle: eu-central-1
    direction: LR
    children:
      - id: clickpipes
        ref: catalog/clickhouse/clickpipes
        subtitle: Kafka ingest
      - id: ch
        type: datastore
        ref: catalog/clickhouse/clickhouse
        title: ClickHouse service
        subtitle: Production

nodes:
  - id: okta
    type: external
    icon: lucide/key
    title: Okta
    subtitle: SSO

flows:
  - orders-db -> cdc: { label: Logical replication, kind: data, step: 1 }
  - cdc -> topics: { label: Change events, kind: data, step: 2 }
  - topics -> clickpipes:
      { label: Consume, kind: data, protocol: Kafka SASL_SSL, secure: tls, step: 3 }
  - clickpipes -> ch: { label: Insert, kind: data, step: 4 }
  - grafana -> endpoint:
      { label: Dashboards, kind: request, protocol: HTTPS 8443, secure: tls, step: 5 }
  - superset -> endpoint: { label: SQL, kind: request, protocol: HTTPS 8443, secure: tls }
  - endpoint -> clickhouse: { label: PrivateLink, kind: network, secure: private-link }
  - archive <- ch: { label: Export, kind: data, protocol: S3 API, secure: tls, schedule: daily }
  - okta -> clickhouse: { label: SAML SSO (console), kind: access, secure: sso }

story:
  steps:
    - title: An order changes
      targets: [orders-db, cdc]
      text: The customer's **Orders DB** publishes changes through logical replication.
      duration: 8
    - title: Capture the change
      targets: ["orders-db -> cdc"]
      text: The CDC connector reads the database change and prepares an event.
      callouts: [{ at: cdc, text: Change data capture }]
      duration: 8
    - title: Stream into ClickHouse
      targets: ["cdc -> topics", "topics -> clickpipes"]
      text: Kafka topics retain the event. ClickPipes consumes it over an encrypted connection.
      duration: 10
    - title: Make the order queryable
      targets: ["clickpipes -> ch"]
      text: ClickPipes inserts the change into the ClickHouse service.
      callouts: [{ at: ch, text: Ready for analytics }]
      duration: 8
    - title: Query through the private endpoint
      targets: [grafana, superset, endpoint, clickhouse]
      text: Dashboards and self-service BI query ClickHouse through the customer's PrivateLink endpoint.
      duration: 8
    - title: Keep a cold archive
      targets: ["archive <- ch"]
      text: A daily export copies data from ClickHouse to the S3 archive.
      duration: 8
