# Sources: Qlik Answers product and security evaluation guides; reviewed 2026-09-29.
# https://help.qlik.com/en-US/evaluation-guides/Content/ai/qlik-answers.htm
# https://help.qlik.com/en-US/evaluation-guides/Content/ai/answers-security.htm
# Logical capabilities; a question uses only the relevant agents, not every stage.
diagram: "1"
title: Qlik Answers
description: From governed enterprise content to a cited answer. Agents combine
  application insights and knowledge retrieval; people review the results.
direction: LR
nodeStyle: icon
legend: auto
component:
  icon: qlik/answers
  description: A managed assistant combining Qlik applications and knowledge bases into
    explainable answers, with human review.
zones:
  - id: sources
    title: Enterprise connectivity
    owner: customer
    children:
      - id: documents
        type: datastore
        icon: lucide/file
        title: Enterprise content
        subtitle: Connected file stores
      - id: connectors
        icon: lucide/plug
        title: Enterprise connectors
        subtitle: Access content in place
      - id: apps
        icon: qlik/qlik
        title: Qlik applications
        subtitle: Governed measures and dimensions
    direction: TB
  - id: knowledge
    title: Managed knowledge
    owner: saas
    children:
      - id: indexing
        icon: lucide/workflow
        title: Knowledge preparation
        subtitle: Parse, chunk, embed and index
      - id: index
        type: datastore
        icon: lucide/database
        title: Managed knowledge bases
        subtitle: Document references and vector index
        description: Domain-specific indexes; source documents remain at the source unless Qlik
          DataFiles is used.
    direction: TB
  - id: parsing
    title: Question parsing · Answers Agent
    owner: saas
    children:
      - id: question
        type: actor
        icon: lucide/message-square
        title: User question
        subtitle: Qlik Cloud or embedded assistant
      - id: answers
        icon: qlik/answers
        title: Plan the answer
        subtitle: Intent, subtasks and relevant sources
        description: Decompose the question and select tools and accessible resources. Route to
          structured, unstructured or both paths as needed.
      - id: access
        icon: lucide/shield
        title: Governed source selection
        subtitle: Space, role and section access
    direction: TB
    arrangement: sequence
  - id: formulation
    title: Answer formulation
    owner: saas
    direction: LR
    arrangement: parallel
    align: start
    children:
      - id: structured
        title: Structured · application insights
        owner: saas
        children:
          - id: semantic
            icon: lucide/brain
            title: Semantic search agent
            subtitle: Find measures and dimensions
            description: Semantic search tool identifies relevant application items.
          - id: analyst
            icon: lucide/bar-chart
            title: Data Analyst Agent
            subtitle: Build expressions and analysis package
            description: Prefer master measures and dimensions; specify data, analysis and output.
          - id: chart
            icon: lucide/bar-chart
            title: Chart agent
            subtitle: Chart generator tool
          - id: dashboard
            icon: lucide/monitor
            title: Dashboard Authoring agent
            subtitle: Dashboard generator tool
        direction: LR
        arrangement: sequence
        align: start
      - id: unstructured
        title: Unstructured · knowledge retrieval
        owner: saas
        children:
          - id: retrieval
            icon: lucide/layers
            title: Retrieval context
            subtitle: Metadata, glossary and synonyms
            description:
              Discover filterable fields such as date, topic and department, and available
              glossary terms.
          - id: kb-agent
            icon: lucide/database
            title: Knowledge base agent
            subtitle: Semantic search and RAG
          - id: help-agent
            icon: lucide/bot
            title: Qlik Help agent
            subtitle: Qlik Cloud documentation
        direction: LR
  - id: collation
    title: Results collation · Answers Agent
    owner: saas
    children:
      - id: results
        title: Agent results
        direction: LR
        arrangement: parallel
        children:
          - id: artifacts
            icon: lucide/bar-chart
            title: Analytical artifacts
            subtitle: Charts, hypercubes and expressions
          - id: chunks
            icon: lucide/file
            title: Relevant text chunks
            subtitle: Source document references
      - id: compose
        icon: qlik/answers
        title: Compose the answer
        subtitle: Combine relevant agent results
      - id: answer
        icon: lucide/message-square
        title: Answer with citations
        subtitle: Insights, charts and source references
      - id: review
        icon: lucide/check
        title: Answer review portal
        subtitle: Questions, feedback and human review
        description: Administrators review questions and user feedback to identify improvements.
          This is human review, not automatic model training.
    direction: TB
    arrangement: sequence
  - id: inference
    title: Shared inference service · AWS
    owner: saas
    provider: aws
    children:
      - id: bedrock
        icon: lucide/brain
        title: Amazon Bedrock
        subtitle: Foundation model inference
        description: Logical shared dependency, not an extra final pipeline step. Inference
          content is processed in memory, not retained or used for model training.
          Cross-region routing is tenant-controlled.
        docs: https://help.qlik.com/en-US/evaluation-guides/Content/ai/answers-security.htm
flows:
  - documents -> connectors: Content
  - connectors -> indexing: Ingestion
  - indexing -> index: Index
  - question -> answers: Question
  - index -> answers: Knowledge sources
  - apps -> answers: Application sources
  - answers -> compose: Answer orchestration
  - answers -> access: Find sources
  - access -> semantic: Structured tasks
  - access -> retrieval: Unstructured tasks
  - apps -> semantic: Application context
  - semantic -> analyst: Relevant items
  - analyst -> chart: Analysis package
  - chart -> dashboard: Chart objects
  - dashboard -> artifacts: Dashboard artifacts
  - analyst -> artifacts: Expressions and data
  - chart -> artifacts: Charts
  - index -> kb-agent: Relevant context
  - retrieval -> kb-agent: Retrieval plan
  - retrieval -> help-agent: Product help
  - kb-agent -> chunks: Retrieved passages
  - help-agent -> chunks: Help references
  - artifacts -> compose: Analytical results
  - chunks -> compose: Grounding context
  - compose -> answer: Explainable response
  - answer -> review: Questions and feedback
  - compose <-> bedrock:
      label: Shared model inference
      kind: request
      protocol: TLS 1.3
      secure: tls
notes:
  - at: structured
    text: Use the agents needed for the question; charts and dashboards are not mandatory
      outputs.
  - at: inference
    text: Private AWS connectivity. Tenant data, indexes and history are encrypted in the home
      region.
visual:
  lanes:
    - id: connect
      role: sources
      title: Connect
      of:
        - sources
    - id: prepare
      role: vendor-cloud
      title: Prepare
      of:
        - knowledge
    - id: ask
      role: vendor-cloud
      title: Ask
      of:
        - parsing
        - formulation
    - id: explain
      role: vendor-cloud
      title: Explain
      of:
        - collation
    - id: improve
      role: targets
      title: Review
  boxes:
    - id: enterprise
      lane: connect
      title: Enterprise connectors
      members:
        - documents
        - connectors
      summary: true
    - id: applications
      lane: prepare
      title: Qlik applications
      members:
        - apps
      summary: true
    - id: managed-knowledge
      lane: prepare
      title: Managed knowledge bases
      members:
        - indexing
        - index
      summary: true
    - id: assistant
      lane: ask
      title: Embeddable assistant
      members:
        - question
        - answers
        - access
        - semantic
        - analyst
        - chart
        - dashboard
        - retrieval
        - kb-agent
        - help-agent
      summary: true
    - id: explainable
      lane: explain
      title: Explainable answers
      members:
        - artifacts
        - chunks
        - compose
        - answer
        - bedrock
      summary: true
    - id: human-review
      lane: improve
      title: Answer review portal
      members:
        - review
      summary: true
  flows:
    - from: enterprise
      to: managed-knowledge
      label: ""
    - from: managed-knowledge
      to: assistant
      label: ""
    - from: applications
      to: assistant
      label: ""
    - from: assistant
      to: explainable
      label: ""
    - from: explainable
      to: human-review
      label: ""
  composition: process
story:
  autoplay: false
  steps:
    - title: Connect trusted sources
      targets:
        - sources
        - knowledge
      text: Connect enterprise content to managed knowledge bases and use existing Qlik
        applications for structured insights.
    - title: Understand the question
      targets:
        - question
        - parsing
      text: The assistant plans relevant subtasks and selects sources within the user's access
        rights.
    - title: Choose the right capabilities
      targets:
        - structured
        - unstructured
      text: Application agents produce analytical artifacts; knowledge and Help agents retrieve
        relevant passages. A question can use either path or both.
    - title: Explain the result
      targets:
        - collation
        - answer
      text: The Answers Agent combines the relevant outputs into one coherent answer with
        supporting references.
    - title: Review and improve
      targets:
        - review
      text: People review questions and feedback to identify gaps in content and assistant
        configuration.
