# yaml-language-server: $schema=../../schema/arch-diagram.v1.schema.json
# (The v1 schema file arrives with DG-26; until then this modeline points at nothing.)
#
# Template: Qlik Talend Cloud pipeline (DG-67, template 2).
# The technical lens is Qlik Open Lakehouse on AWS, as on slide 9 of the Qlik style guide
# deck. The visual lens below follows the lanes and boxes of slide 4 ("Qlik Talend Cloud
# Pipeline Architecture"). Qlik Replicate captures the source changes on premises (slides
# 12–13) and lands them in the customer's S3 bucket. The Open Lakehouse cluster turns them
# into Iceberg tables, and the warehouse platforms read those tables through the mirror.
# The Qlik Talend Cloud tenant is the control plane on top.
# Written in dialect v1 (plan §4.3). The current app reads dialect "0" only.
diagram: "1"
title: Qlik Talend Cloud pipeline with Qlik Open Lakehouse on AWS
description: How Qlik Replicate moves on-premises change data into S3 and the Open Lakehouse cluster turns it into Iceberg tables.
direction: LR # LR | TB — the ELK direction
nodeStyle: icon # icon | card
theme: qlik # the Qlik theme also names the hero for the visual lens (style-system concept S1)
legend: auto

zones:
  # "In an on-prem/customer zone" (item): Kinesis and S3 are AWS services, so this zone
  # is the customer's without claiming on-premises.
  - id: data-sources
    owner: customer
    title: Customer data sources
    description: The customer's systems and streams that the pipeline reads from.
    children:
      - id: streams
        title: Streaming & events
        description: Event streams and files that arrive continuously.
        children:
          - id: kafka
            type: queue
            # No Apache Kafka icon in the index; aws/managed-streaming-for-apache-kafka would
            # suggest Amazon MSK, so a generic glyph stands in.
            icon: lucide/activity
            title: Kafka
            description: An Apache Kafka cluster that carries event streams.
            docs: https://kafka.apache.org/documentation/
          - id: kinesis
            type: queue
            icon: aws/kinesis
            title: Amazon Kinesis
            description: An AWS service that carries real-time data streams.
            docs: https://docs.aws.amazon.com/kinesis/
          - id: s3-source
            type: datastore
            icon: aws/simple-storage-service
            title: Amazon S3
            subtitle: Source files
            description: Object storage on AWS that holds files the pipeline picks up.
            docs: https://docs.aws.amazon.com/s3/
      - id: systems
        title: CDC & batch sources
        description: Operational systems whose changes are captured, or which are read in batches.
        children:
          # Not `type: external`: the item puts these sources in the customer zone, and an
          # external node inside a zone draws the v0/v1 warning `external-in-zone`.
          - id: saas-apps
            icon: lucide/cloud
            title: SaaS applications
            description: Business applications that the customer uses as a service.
          - id: rdbms
            type: datastore
            icon: lucide/database
            title: RDBMS
            description: Relational databases behind the customer's operational applications.
          - id: sap
            icon: sap/sap
            title: SAP
            description: The customer's SAP business systems.
          - id: mainframe
            icon: lucide/server
            title: Mainframe
            description: Mainframe systems that hold core transaction data.
  - id: customer-env
    owner: customer
    kind: on-prem
    title: Customer managed environment
    description: Servers the customer runs itself, where the change capture happens.
    children:
      - id: replicate
        icon: qlik/qlik # intended: a Qlik Replicate icon; the icon index has none
        title: Qlik Replicate
        subtitle: CDC & bulk ingestion
        description: Captures changes and bulk loads from source systems and delivers them to a target.
  - id: vpc
    owner: customer
    kind: vnet
    provider: aws
    title: Customer VPC — AWS
    description: The customer's own AWS network, where the lakehouse runs.
    children:
      - id: nia
        icon: aws/ec2
        title: Network Integration Agent
        subtitle: Amazon EC2, on-demand instance
        description: An agent on an EC2 instance that links the Qlik Talend Cloud tenant to the lakehouse in the VPC.
      - id: lakehouse
        icon: aws/ec2-auto-scaling
        title: Open Lakehouse Cluster
        subtitle: Amazon EC2 Auto Scaling group, Spot Instances
        description: Turns the landed data into Apache Iceberg tables and keeps them optimized, on instances that scale with the load.
      - id: object-storage
        icon: aws/simple-storage-service
        title: Cloud Object Storage
        description: Amazon S3 buckets for the landed data, the configuration and the Iceberg tables.
        docs: https://docs.aws.amazon.com/s3/
        children:
          - id: landing
            type: datastore
            icon: aws/simple-storage-service
            title: Landing bucket
            description: Receives the captured changes and bulk loads as they arrive.
          - id: config
            type: datastore
            icon: aws/simple-storage-service
            title: Config bucket
            description: Holds the configuration of the Open Lakehouse.
          - id: tables
            type: datastore
            icon: aws/simple-storage-service
            title: Table storage
            subtitle: Iceberg tables
            description: Stores the Apache Iceberg tables that the cluster writes.
      - id: catalog
        icon: aws/glue
        title: AWS Glue Data Catalog
        subtitle: Iceberg catalog
        description: Registers the Iceberg tables so that other engines can find and query them.
        docs: https://docs.aws.amazon.com/glue/
  - id: dwh
    owner: saas
    title: DWH platform
    description: Warehouse platforms that read the Iceberg tables through the mirror.
    children:
      - id: snowflake
        type: datastore
        icon: snowflake/snowflake
        title: Snowflake
        description: A cloud data warehouse; here it reads the mirrored Iceberg tables.
        docs: https://docs.snowflake.com/
      - id: databricks
        type: datastore
        icon: databricks/databricks
        title: Databricks
        description: A data and AI platform; here it reads the mirrored Iceberg tables.
        docs: https://docs.databricks.com/
      - id: redshift
        type: datastore
        icon: aws/redshift
        title: Amazon Redshift
        description: The AWS cloud data warehouse; here it reads the mirrored Iceberg tables.
        docs: https://docs.aws.amazon.com/redshift/
  - id: qtc
    owner: saas
    provider: qlik
    title: Qlik Talend Cloud tenant
    description: The customer's Qlik Talend Cloud tenant, run by Qlik; the control plane of the pipeline.
    children:
      - id: pipelines
        icon: qlik/talend-cloud
        title: Pipeline Design & Operations
        description: Where data engineers design the pipelines and watch them run.
      - id: dpm
        icon: lucide/layers
        title: Data Product Management
        description: Groups curated datasets into data products that other people can find and use.
      - id: data-products
        icon: lucide/check
        title: Qlik Data Products
        subtitle: Lineage, quality rules, trust score
        description: Shows the lineage, the quality rules and the Qlik Trust Score of each data product.

flows: # string shorthand or object form
  # Zone endpoints: every system in the zone takes the same path.
  - systems -> replicate: { label: CDC & bulk capture, kind: data }
  - streams -> lakehouse: { label: Stream ingestion, kind: data, schedule: real-time }
  - replicate -> landing: { label: CDC & bulk, kind: data, schedule: real-time }
  - landing -> lakehouse: { label: Read landed data, kind: data }
  - lakehouse -> tables: { label: Write Iceberg tables, kind: data }
  - config -> lakehouse: { label: Configuration, kind: control }
  - lakehouse -> catalog: { label: Register tables, kind: control }
  - nia <-> lakehouse: { label: Manage the cluster, kind: control }
  - tables -> dwh: { label: Mirror, kind: data }
  - catalog -> dwh: { label: Table metadata, kind: control }
  - pipelines -> dwh: { label: Transform (ELT), kind: control }
  - pipelines <-> nia: { label: Tasks and status, kind: control }
  - dpm -> data-products: { label: Publish, kind: control }

story:
  autoplay: false
  steps:
    - title: Capture
      targets: [systems, replicate]
      text: |
        Qlik Replicate reads the changes (CDC) and bulk loads from the operational systems.
        It runs on servers in the customer's own environment.
    - title: Land
      targets: ["replicate -> landing"] # one flow: the camera follows the edge
      text: |
        The captured data lands in the S3 landing bucket inside the customer's VPC.
      callouts: [{ at: landing, text: LANDING }]
    - title: Store
      targets: [lakehouse, tables, catalog]
      text: |
        The Open Lakehouse cluster writes the data as Apache Iceberg tables and registers
        them in the AWS Glue Data Catalog.
      callouts: [{ at: tables, text: STORAGE }]
    - title: Mirror and transform
      targets: ["tables -> dwh", "pipelines -> dwh"] # two flows: the camera follows each in turn
      text: |
        The warehouse platforms read the Iceberg tables through the mirror. Qlik Talend
        Cloud runs the transformations inside the warehouse (ELT).
      callouts: [{ at: dwh, text: MIRROR · TRANSFORM }]
    - title: Consume
      targets: [dwh]
      text: |
        Snowflake, Databricks or Amazon Redshift serve the data to analytics and applications.
    - title: The control plane
      # Every top-level zone is a target, so the camera ends on the whole picture; the
      # callout puts the tenant in focus.
      targets: [qtc, data-sources, customer-env, vpc, dwh]
      text: |
        The Qlik Talend Cloud tenant designs and runs every step. It publishes data products
        with their lineage, quality rules and trust score.
      callouts: [{ at: data-products, text: "Lineage, quality rules, trust score" }]

# Hand-tuned visual lens (DG-36), after deck slide 4. The hero comes from the theme (S1).
# The QLIK TALEND CLOUD lane has the role vendor-cloud: the profile draws that role as the
# control plane band on top. `controlPlane` lists the technical ids in that band, as the
# visual-lens concept (§3) does. Slide 9 (the AWS details) is the technical lens above.
visual:
  controlPlane: [pipelines, dpm]
  lanes:
    - { id: sources, role: sources, title: Data sources, of: [data-sources] }
    - { id: managed, role: customer-managed, title: Customer managed env, of: [customer-env] }
    - { id: targets, role: targets, title: Targets, of: [vpc, dwh] }
    - { id: control, role: vendor-cloud, title: Qlik Talend Cloud, of: [qtc] }
  boxes:
    - id: streaming
      lane: sources
      title: Streaming & Events
      members: [kafka, kinesis, s3-source]
    - id: cdc-batch
      lane: sources
      title: CDC & Batch Sources
      members: [saas-apps, rdbms, sap, mainframe]
    # Slide 4 has the Data Movement Gateway in this place. Slide 12 swaps in Qlik Replicate
    # at the same position (deck rule 7: variants keep positions and swap labels).
    - { id: capture, lane: managed, title: Qlik Replicate, members: [replicate] }
    - id: tenant
      lane: control
      title: Customer Tenant
      members: [pipelines, dpm]
      sub: [pipelines, dpm]
    - { id: cluster, lane: targets, title: Open Lakehouse Cluster, members: [lakehouse, nia] }
    - id: storage
      lane: targets
      title: Cloud Object Storage
      members: [landing, config, tables, catalog]
      sub: [landing, config, tables]
      processes: [landing, storage]
    # Slide 4 titles this box "DWH Targets"; the item and slide 9 say "DWH Platform".
    - id: dwh-platform
      lane: targets
      title: DWH Platform
      members: [snowflake, databricks, redshift]
      processes: [mirror, transform]
    # Slide 4 draws this box right of the targets lane, outside every lane. No lane role
    # fits, so it sits in the targets lane as an aside box.
    - id: products
      lane: targets
      title: Qlik Data Products
      members: [data-products]
      aside: true
  flows:
    # The technical flows start at zones; these name the lines the slide draws.
    - { from: streaming, to: cluster }
    - { from: cdc-batch, to: capture }
    # The deck puts the ELT badge on the data line into the warehouse platform (slide 9);
    # the technical transform flow is `pipelines -> dwh`.
    - { from: storage, to: dwh-platform, process: elt }
